[pytest]
addopts = -v -ra --tb=short --strict-markers
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = testcase
markers =
    login: 登录与验证码
    zhuin: 注册
    select: 用户信息与登录状态
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s %(filename)s:%(lineno)d %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S